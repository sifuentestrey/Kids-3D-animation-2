name: Deploy to GitHub Pages

# Builds the Vite frontend and publishes it to GitHub Pages so the app has a
# public URL to open on a phone. Note: the /api serverless routes (Gemini,
# Higgsfield) do NOT run on Pages — the app falls back gracefully without
# them, and no API keys are configured, so the visual app works fully.

on:
  push:
    branches:
      - claude/drawing-app-2-lejafv
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build
        run: npx vite build
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
